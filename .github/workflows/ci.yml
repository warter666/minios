name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain and QEMU
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          gcc-arm-none-eabi qemu-system-arm
      - name: Build kernel
        run: make
      - name: QEMU smoke test
        run: bash test.sh
